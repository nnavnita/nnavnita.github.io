# bullseye.yaml — convergence targets for this project.
#
# Targets are desired project states expressed as testable properties,
# with dependency tracking and frontier computation. This file is the
# source of truth: read and written by the bullseye MCP server, and safe
# to hand-edit (the targets live below).
#
# What is bullseye / how do I install it?
#   https://github.com/marcelocantos/bullseye
#
# This banner is regenerated by bullseye on every write — edit the
# targets, not these lines.
schema_version: 5
targets:
  T1:
    name: Personal landing page live and self-updating with current project list
    status: achieved
    value: 5.0
    cost: 3.0
    acceptance:
    - Static site deployed to nnavnita.github.io on push to main (`.github/workflows/deploy.yml`)
    - '`scripts/update_projects.py` runs daily via cron (`update-projects.yml`) and commits a refreshed project list into index.html from the GitHub API — no manual edits needed when a new repo is created'
    - CNAME configured for custom domain
    context: Both workflows already exist and are wired up (daily 06:00 UTC cron + push-triggered). This means new dev/ repos surface here automatically once pushed to GitHub — no need to hand-edit index.html per project.
    tags:
    - site
    origin: bullseye_init
    discovered: 2026-08-15
    achieved: 2026-08-15
