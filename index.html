<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Navnita Nandakumar</title>
    <meta name="description" content="Navnita Nandakumar — software engineer." />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #faf8f8;
        --fg: #2b2b2b;
        --muted: #6b6b6b;
        --rule: #e5e5e5;
        --link: #284b63;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161618;
          --fg: #ebebec;
          --muted: #9a9a9a;
          --rule: #2a2a2c;
          --link: #7b97aa;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 17px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 4rem 1.5rem 6rem;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 0.25rem;
        letter-spacing: -0.01em;
      }
      p.tagline {
        color: var(--muted);
        margin: 0 0 2.5rem;
      }
      h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 2rem 0 0.75rem;
        font-weight: 600;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--rule);
      }
      li:last-child { border-bottom: none; }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover { text-decoration: underline; }
      .desc {
        color: var(--muted);
        margin-left: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Navnita Nandakumar</h1>
      <p class="tagline">Software engineer, occasional tinkerer.</p>

      <h2>Elsewhere</h2>
      <ul>
        <li><a href="https://www.linkedin.com/in/navnitanandakumar/">LinkedIn</a></li>
        <li><a href="https://github.com/nnavnita">GitHub</a></li>
      </ul>

      <h2>Projects</h2>
      <ul>
        <li><a href="/gambit/">Gambit</a><span class="desc">— chess engine in Rust</span></li>
      </ul>

      <h2>Contributions</h2>
      <ul>
        <li><a href="https://riot-mind.vercel.app/">Riot Mind</a><span class="desc">— business OS for freelancers</span></li>
        <li><a href="https://github.com/marcelocantos/mnemo">Mnemo</a><span class="desc">— MCP server for searching past Claude Code sessions</span></li>
      </ul>
    </main>
  </body>
</html>
